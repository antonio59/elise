<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#9a4d5c" />
    <meta name="color-scheme" content="light" />

    <!-- Primary -->
    <title>Elise Reads</title>
    <meta
      name="description"
      content="Hi - I'm Elise. Browse books I've finished, art I make, photos I keep, and words I write."
    />
    <meta name="author" content="Elise" />
    <link rel="canonical" href="https://elisereads.com/" />

    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Open Graph (crawlers read this static HTML - not client JS) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Elise Reads" />
    <meta property="og:locale" content="en_GB" />
    <meta property="og:url" content="https://elisereads.com/" />
    <meta property="og:title" content="Elise Reads" />
    <meta
      property="og:description"
      content="Hi - I'm Elise. Browse books I've finished, art I make, photos I keep, and words I write."
    />
    <meta property="og:image" content="https://elisereads.com/og-image.jpg" />
    <meta property="og:image:secure_url" content="https://elisereads.com/og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Elise Reads - books, art & things I think about" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Elise Reads" />
    <meta
      name="twitter:description"
      content="Hi - I'm Elise. Browse books I've finished, art I make, photos I keep, and words I write."
    />
    <meta name="twitter:image" content="https://elisereads.com/og-image.jpg" />
    <meta name="twitter:image:alt" content="Elise Reads - books, art & things I think about" />

    <!-- CSP is served via Netlify header (netlify.toml) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
