name: Dependency Review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Dependency Review
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4
        with:
          fail-on-severity: moderate
          # MPL-2.0: lightningcss (Tailwind CSS native engine)
          allow-licenses: MIT, MIT-0, Apache-2.0, BSD-3-Clause, BSD-2-Clause, ISC, CC-BY-4.0, BlueOak-1.0.0, 0BSD, MPL-2.0
